# This file generates the GitHub Actions matrix.
# For simple board + shield combinations, add them to the top level board and
# shield arrays, for more control, add individual board + shield combinations
# to the `include` property. You can also use the `cmake-args` property to
# pass flags to the build command, `snippet` to add a Zephyr snippet, and
# `artifact-name` to assign a name to distinguish build outputs from each other:
#
# Each layout is a separate keymap in config/, selected with -DKEYMAP_FILE.
# Only the left (central) half uses the keymap, so one right-half build works
# with every layout.
---
include:
  - board: sofle_choc_pro_left
    snippet: studio-rpc-usb-uart
    shield: sharp_mip
    cmake-args: -DCONFIG_ZMK_STUDIO=y -DKEYMAP_FILE=${GITHUB_WORKSPACE}/config/sofle_full.keymap
    artifact-name: sofle_full_left
  - board: sofle_choc_pro_left
    snippet: studio-rpc-usb-uart
    shield: sharp_mip
    cmake-args: -DCONFIG_ZMK_STUDIO=y -DKEYMAP_FILE=${GITHUB_WORKSPACE}/config/sofle_small.keymap
    artifact-name: sofle_small_left
  - board: sofle_choc_pro_right
    shield: sharp_mip
    snippet: studio-rpc-usb-uart
    cmake-args: -DKEYMAP_FILE=${GITHUB_WORKSPACE}/config/sofle_full.keymap
    artifact-name: sofle_right

  - board: sofle_choc_pro_left
    shield: settings_reset
    snippet: studio-rpc-usb-uart
  - board: sofle_choc_pro_right
    shield: settings_reset
    snippet: studio-rpc-usb-uart
